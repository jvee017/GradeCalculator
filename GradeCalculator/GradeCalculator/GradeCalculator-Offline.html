<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Grade Calculator (Offline Version)</title>
<style>
:root {
  --bg: #eef2f7;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-dark: #1d4ed8;
  --border: #d1d5db;
  --pass: #15803d;
  --pass-bg: #dcfce7;
  --fail: #b91c1c;
  --fail-bg: #fee2e2;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 12px;
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.card {
  max-width: 560px;
  margin: 0 auto;
  background: var(--card);
  padding: 28px;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
}

h1 { margin: 0 0 4px; font-size: 1.6rem; color: var(--accent); }
h2 { margin: 16px 0 12px; }
.subtitle { margin: 0 0 20px; color: var(--muted); }

label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 0.9rem; }

input {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 1rem;
}
input:focus { outline: 2px solid var(--accent); border-color: transparent; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 11px 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover { background: var(--accent-dark); }

table { width: 100%; border-collapse: collapse; margin-top: 8px; }
th, td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; }
th { background: #f3f4f6; width: 50%; }

.total th, .total td { font-size: 1.1rem; font-weight: 700; }

.badge { padding: 3px 12px; border-radius: 999px; font-weight: 700; }
.badge.passed { color: var(--pass); background: var(--pass-bg); }
.badge.failed { color: var(--fail); background: var(--fail-bg); }

.errors { color: var(--fail); padding-left: 20px; }
.error-title { color: var(--fail); }

.scale { margin-top: 28px; font-size: 0.9rem; }
.scale caption { text-align: left; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
.scale th { width: auto; }

.hidden { display: none; }
</style>
</head>
<body>
<main class="card">
  <h1>Student Grade Calculator</h1>

  <section id="inputView">
    <p class="subtitle">Enter the scores (0 to 100) to compute the final grade.</p>
    <form id="gradeForm" novalidate>
      <label for="name">Student name</label>
      <input type="text" id="name" maxlength="50" placeholder="e.g. Maria Santos">
      <div class="grid">
        <div><label for="quiz">Quiz (20%)</label><input type="number" id="quiz" step="any"></div>
        <div><label for="assignment">Assignment (20%)</label><input type="number" id="assignment" step="any"></div>
        <div><label for="midterm">Midterm Exam (25%)</label><input type="number" id="midterm" step="any"></div>
        <div><label for="final">Final Exam (35%)</label><input type="number" id="final" step="any"></div>
      </div>
      <button type="submit" class="btn">Compute Grade</button>
    </form>
    <table class="scale">
      <caption>Grading scale</caption>
      <tr><th>Final Grade</th><th>Letter</th><th>Remark</th></tr>
      <tr><td>90 – 100</td><td>A</td><td>Passed</td></tr>
      <tr><td>80 – 89</td><td>B</td><td>Passed</td></tr>
      <tr><td>70 – 79</td><td>C</td><td>Passed</td></tr>
      <tr><td>60 – 69</td><td>D</td><td>Passed</td></tr>
      <tr><td>Below 60</td><td>F</td><td>Failed</td></tr>
    </table>
  </section>

  <section id="resultView" class="hidden"></section>
</main>

<script>
const W = { quiz: 0.20, assignment: 0.20, midterm: 0.25, final: 0.35 };
const LABELS = { quiz: "Quiz", assignment: "Assignment", midterm: "Midterm Exam", final: "Final Exam" };

function getLetter(g) {
  if (g >= 90) return "A";
  else if (g >= 80) return "B";
  else if (g >= 70) return "C";
  else if (g >= 60) return "D";
  else return "F";
}
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

document.getElementById("gradeForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const errors = [];
  const s = {};
  if (!name) errors.push("Student name is required.");
  for (const k in W) {
    const raw = document.getElementById(k).value.trim();
    const v = Number(raw);
    if (raw === "" || !Number.isFinite(v) || v < 0 || v > 100)
      errors.push(LABELS[k] + " score must be a number between 0 and 100.");
    s[k] = v;
  }
  const out = document.getElementById("resultView");
  let html;
  if (errors.length) {
    html = '<h2 class="error-title">Please fix the following:</h2><ul class="errors">' +
           errors.map(x => "<li>" + esc(x) + "</li>").join("") +
           '</ul><button class="btn" id="back">&larr; Go back</button>';
  } else {
    const fg = s.quiz*W.quiz + s.assignment*W.assignment + s.midterm*W.midterm + s.final*W.final;
    const passed = fg >= 60;
    html = '<h2>Result</h2><table>' +
      '<tr><th>Student Name</th><td>' + esc(name) + '</td></tr>' +
      '<tr><th>Quiz (20%)</th><td>' + s.quiz.toFixed(2) + '</td></tr>' +
      '<tr><th>Assignment (20%)</th><td>' + s.assignment.toFixed(2) + '</td></tr>' +
      '<tr><th>Midterm Exam (25%)</th><td>' + s.midterm.toFixed(2) + '</td></tr>' +
      '<tr><th>Final Exam (35%)</th><td>' + s.final.toFixed(2) + '</td></tr>' +
      '<tr class="total"><th>Final Grade</th><td>' + fg.toFixed(2) + '</td></tr>' +
      '<tr><th>Letter Grade</th><td>' + getLetter(fg) + '</td></tr>' +
      '<tr><th>Remark</th><td><span class="badge ' + (passed ? "passed" : "failed") + '">' +
      (passed ? "Passed" : "Failed") + '</span></td></tr></table>' +
      '<button class="btn" id="back">Compute another student</button>';
  }
  out.innerHTML = html;
  document.getElementById("inputView").classList.add("hidden");
  out.classList.remove("hidden");
  document.getElementById("back").onclick = () => {
    out.classList.add("hidden");
    document.getElementById("inputView").classList.remove("hidden");
  };
});
</script>
</body>
</html>
